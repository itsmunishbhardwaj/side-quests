<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo Day Voting</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f4f6f9;
      color: #1a1a2e;
      min-height: 100vh;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 2rem 1.5rem;
      text-align: center;
    }
    header h1 { font-size: 2rem; letter-spacing: -0.5px; }
    header p  { margin-top: 0.4rem; opacity: 0.7; font-size: 0.95rem; }

    main {
      max-width: 1050px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .toolbar span { font-size: 0.85rem; color: #666; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.55rem 1.2rem;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: #4f46e5; color: #fff; }
    .btn-primary:hover { background: #4338ca; }

    .btn-vote {
      background: #f0f0f5;
      color: #4f46e5;
      border: 1.5px solid #d1d5db;
      padding: 0.3rem 0.75rem;
      font-size: 0.8rem;
      border-radius: 20px;
      white-space: nowrap;
    }
    .btn-vote:hover:not(:disabled) { background: #e8e8ff; border-color: #a5b4fc; }
    .btn-vote:disabled { opacity: 0.55; cursor: not-allowed; background: #f9f9fb; }
    .btn-vote.voted { background: #ede9fe; border-color: #a78bfa; color: #6d28d9; }

    .table-wrapper {
      overflow-x: auto;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    table { width: 100%; border-collapse: collapse; background: #fff; }

    thead th {
      background: #1a1a2e;
      color: #fff;
      padding: 0.85rem 1rem;
      text-align: left;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    tbody tr { border-bottom: 1px solid #f0f0f5; transition: background 0.1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #fafafa; }

    td { padding: 0.9rem 1rem; font-size: 0.92rem; vertical-align: middle; }

    .td-votes { text-align: center; white-space: nowrap; }
    .vote-count {
      display: inline-block;
      font-weight: 700;
      font-size: 1.05rem;
      color: #4f46e5;
      min-width: 2rem;
      text-align: right;
      margin-right: 0.4rem;
    }

    .badge-date {
      display: inline-block;
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
      border-radius: 6px;
      padding: 0.2rem 0.55rem;
      font-size: 0.78rem;
      font-weight: 500;
    }
    .badge-tbd { color: #9ca3af; font-size: 0.8rem; font-style: italic; }

    .tabs {
      display: flex;
      gap: 0.25rem;
      border-bottom: 2px solid #e5e7eb;
      margin-bottom: 1.5rem;
    }
    .tab {
      background: none;
      border: none;
      padding: 0.75rem 1.25rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: #6b7280;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: color 0.15s, border-color 0.15s;
    }
    .tab:hover { color: #1a1a2e; }
    .tab.active { color: #4f46e5; border-bottom-color: #4f46e5; }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: #eef2ff;
      color: #4338ca;
      border: 1px solid #c7d2fe;
      border-radius: 999px;
      padding: 0.15rem 0.5rem 0.15rem 0.6rem;
      font-size: 0.8rem;
      margin: 0.1rem 0.25rem 0.1rem 0;
      white-space: nowrap;
    }
    .chip-x {
      background: none;
      border: none;
      color: #6366f1;
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: 0;
      width: 1.1rem;
      height: 1.1rem;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s, color 0.1s;
    }
    .chip-x:hover { background: #c7d2fe; color: #312e81; }
    .chip-x:disabled { opacity: 0.5; cursor: not-allowed; }
    .chip-empty { color: #9ca3af; font-size: 0.82rem; font-style: italic; }

    .host-cell {
      font-weight: 500;
    }
    .host-name { color: #1a1a2e; }
    .host-empty {
      color: #9ca3af;
      font-style: italic;
      font-weight: 400;
    }
    .link-btn {
      background: none;
      border: none;
      color: #4f46e5;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      margin-left: 0.4rem;
      text-decoration: underline;
    }
    .link-btn:hover { color: #4338ca; }

    .inline-form {
      display: flex;
      gap: 0.35rem;
      align-items: center;
    }
    .inline-form input {
      flex: 1;
      min-width: 0;
      padding: 0.35rem 0.6rem;
      border: 1.5px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.82rem;
      font-family: inherit;
      outline: none;
    }
    .inline-form input:focus { border-color: #4f46e5; }
    .inline-form button {
      padding: 0.35rem 0.7rem;
      font-size: 0.78rem;
      border-radius: 6px;
      border: none;
      background: #4f46e5;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .inline-form button:hover { background: #4338ca; }
    .inline-form button:disabled { opacity: 0.55; cursor: not-allowed; }

    .state-row td {
      text-align: center;
      padding: 3rem 1rem;
      color: #9ca3af;
      font-size: 0.95rem;
    }
    .spinner {
      display: inline-block;
      width: 20px; height: 20px;
      border: 3px solid #e5e7eb;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 0.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-overlay.open { display: flex; }

    .modal {
      background: #fff;
      border-radius: 14px;
      padding: 2rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.18);
      position: relative;
    }
    .modal h2 { font-size: 1.25rem; margin-bottom: 1.25rem; color: #1a1a2e; }
    .modal-close {
      position: absolute;
      top: 1rem; right: 1rem;
      background: none; border: none;
      font-size: 1.4rem; cursor: pointer;
      color: #9ca3af; line-height: 1;
    }
    .modal-close:hover { color: #374151; }

    .form-group { margin-bottom: 1rem; }
    .form-group label {
      display: block;
      font-size: 0.82rem; font-weight: 600;
      color: #374151; margin-bottom: 0.3rem;
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.9rem;
      font-family: inherit;
      outline: none;
      resize: vertical;
      transition: border-color 0.15s;
    }
    .form-group input:focus,
    .form-group textarea:focus { border-color: #4f46e5; }
    .form-hint { font-size: 0.75rem; color: #9ca3af; margin-top: 0.2rem; }

    .form-error {
      color: #dc2626; font-size: 0.82rem;
      margin-top: 0.75rem; display: none;
    }
    .form-error.visible { display: block; }

    .form-actions {
      display: flex; justify-content: flex-end;
      gap: 0.75rem; margin-top: 1.5rem;
    }
    .btn-ghost { background: none; border: 1.5px solid #d1d5db; color: #374151; }
    .btn-ghost:hover { background: #f9fafb; }

    #toast {
      position: fixed;
      bottom: 1.5rem; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #1a1a2e; color: #fff;
      padding: 0.7rem 1.4rem;
      border-radius: 30px;
      font-size: 0.88rem; font-weight: 500;
      z-index: 200;
      transition: transform 0.3s ease;
      pointer-events: none;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
    #toast.is-error { background: #dc2626; }

    @media (max-width: 600px) {
      header h1 { font-size: 1.5rem; }
      .hide-mobile { display: none; }
    }
  </style>
</head>
<body>

<header>
  <h1>Demo Day</h1>
  <p>Upvote topics, or sign up to present on an upcoming demo day.</p>
</header>

<main>
  <div class="tabs" role="tablist">
    <button class="tab active" id="tab-topics"   role="tab" aria-selected="true"  data-panel="panel-topics">Topics</button>
    <button class="tab"        id="tab-schedule" role="tab" aria-selected="false" data-panel="panel-schedule">Schedule</button>
  </div>

  <section class="tab-panel active" id="panel-topics" role="tabpanel" aria-labelledby="tab-topics">
    <div class="toolbar">
      <span id="topic-count">Loading…</span>
      <button class="btn btn-primary" id="open-modal-btn">+ Add Topic</button>
    </div>

    <div class="table-wrapper">
      <table id="topics-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Topic</th>
            <th class="hide-mobile">Seed Idea</th>
            <th>Date</th>
            <th>Votes</th>
          </tr>
        </thead>
        <tbody id="topics-tbody">
          <tr class="state-row">
            <td colspan="5"><span class="spinner"></span> Loading topics…</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

  <section class="tab-panel" id="panel-schedule" role="tabpanel" aria-labelledby="tab-schedule">
    <div class="toolbar">
      <span id="schedule-count">Loading…</span>
      <button class="btn btn-primary" id="open-date-modal-btn">+ Add Date</button>
    </div>

    <div class="table-wrapper">
      <table id="schedule-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Host</th>
            <th>Presenters</th>
            <th>Sign Up</th>
          </tr>
        </thead>
        <tbody id="schedule-tbody">
          <tr class="state-row">
            <td colspan="4"><span class="spinner"></span> Loading schedule…</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <button class="modal-close" id="close-modal-btn" aria-label="Close">&times;</button>
    <h2 id="modal-title">Add a Demo Topic</h2>
    <form id="add-topic-form" novalidate>
      <div class="form-group">
        <label for="field-name">Your Name <span style="color:#dc2626">*</span></label>
        <input type="text" id="field-name" placeholder="Jane Smith" required />
      </div>
      <div class="form-group">
        <label for="field-topic">Topic Title <span style="color:#dc2626">*</span></label>
        <input type="text" id="field-topic" placeholder="Building RAG pipelines with open-source tools" required />
      </div>
      <div class="form-group">
        <label for="field-seed">Seed Idea</label>
        <textarea id="field-seed" rows="3" placeholder="A short description of what you'll demo…"></textarea>
      </div>
      <div class="form-group">
        <label for="field-date">Preferred Date</label>
        <input type="date" id="field-date" />
        <p class="form-hint">Optional — leave blank if flexible.</p>
      </div>
      <div class="form-error" id="form-error"></div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="cancel-btn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="submit-btn">Add Topic</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-overlay" id="date-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="date-modal-title">
  <div class="modal">
    <button class="modal-close" id="close-date-modal-btn" aria-label="Close">&times;</button>
    <h2 id="date-modal-title">Add a Demo Day</h2>
    <form id="add-date-form" novalidate>
      <div class="form-group">
        <label for="date-field-date">Date <span style="color:#dc2626">*</span></label>
        <input type="date" id="date-field-date" required />
      </div>
      <div class="form-group">
        <label for="date-field-host">Host (optional)</label>
        <input type="text" id="date-field-host" placeholder="Who's hosting this one?" />
        <p class="form-hint">Can be set or changed later.</p>
      </div>
      <div class="form-error" id="date-form-error"></div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="date-cancel-btn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="date-submit-btn">Add Date</button>
      </div>
    </form>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
// ── CONFIG — replace with your deployed Apps Script /exec URL ─────────────────
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzCsL1EFrbcVDhnDmE-XMDQ4xrdu6SnY5EIoIRLdhwBfVVzKq7ZvbzXudBDUHdGkv_i/exec';

// ── VOTER IDENTITY ────────────────────────────────────────────────────────────
function getOrCreateVoterId() {
  const KEY = 'demoday_voter_id';
  let id = localStorage.getItem(KEY);
  if (!id) {
    id = typeof crypto.randomUUID === 'function' ? crypto.randomUUID() : fallbackUUID();
    localStorage.setItem(KEY, id);
  }
  return id;
}

function fallbackUUID() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

const VOTER_ID = getOrCreateVoterId();
let votedTopics = new Set();

// ── API ───────────────────────────────────────────────────────────────────────
async function fetchTopics() {
  const res = await fetch(`${APPS_SCRIPT_URL}?action=getTopics`);
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data.topics;
}

// Content-Type: text/plain avoids CORS preflight (Apps Script can't handle OPTIONS)
async function apiPost(body) {
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function formatDate(raw) {
  if (!raw || !raw.trim()) return '<span class="badge-tbd">TBD</span>';
  try {
    const d = new Date(raw.includes('T') ? raw : raw + 'T00:00');
    return `<span class="badge-date">${d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</span>`;
  } catch {
    return `<span class="badge-date">${escHtml(raw)}</span>`;
  }
}

function renderTopics(list) {
  const tbody   = document.getElementById('topics-tbody');
  const counter = document.getElementById('topic-count');

  if (!list || list.length === 0) {
    tbody.innerHTML = '<tr class="state-row"><td colspan="5">No topics yet — be the first to add one!</td></tr>';
    counter.textContent = '0 topics';
    return;
  }

  counter.textContent = `${list.length} topic${list.length === 1 ? '' : 's'}`;

  list.forEach(t => {
    if (Array.isArray(t.voters) && t.voters.includes(VOTER_ID)) votedTopics.add(t.id);
  });

  tbody.innerHTML = list.map(t => {
    const voted = votedTopics.has(t.id);
    return `
      <tr>
        <td>${escHtml(t.name)}</td>
        <td><strong>${escHtml(t.topic)}</strong></td>
        <td class="hide-mobile">${escHtml(t.seed_idea)}</td>
        <td>${formatDate(t.scheduled_date)}</td>
        <td class="td-votes">
          <span class="vote-count" id="count-${t.id}">${t.vote_count}</span>
          <button
            class="btn btn-vote${voted ? ' voted' : ''}"
            data-id="${escHtml(t.id)}"
            ${voted ? 'disabled aria-label="Already voted"' : `aria-label="Upvote ${escHtml(t.topic)}"`}
            onclick="handleVote(this)"
          >${voted ? '✓ Voted' : '▲ Vote'}</button>
        </td>
      </tr>`;
  }).join('');
}

// ── VOTE ──────────────────────────────────────────────────────────────────────
async function handleVote(btn) {
  if (btn.disabled) return;
  const topicId = btn.dataset.id;
  btn.disabled = true;
  btn.textContent = '…';

  try {
    const result = await apiPost({ action: 'vote', topic_id: topicId, voter_id: VOTER_ID });

    if (result.success) {
      votedTopics.add(topicId);
      btn.textContent = '✓ Voted';
      btn.classList.add('voted');
      const countEl = document.getElementById(`count-${topicId}`);
      if (countEl) countEl.textContent = parseInt(countEl.textContent, 10) + 1;
      showToast('Vote recorded!');
    } else if (result.reason === 'already_voted') {
      votedTopics.add(topicId);
      btn.textContent = '✓ Voted';
      btn.classList.add('voted');
      showToast('You already voted for this topic.', true);
    } else {
      btn.disabled = false;
      btn.textContent = '▲ Vote';
      showToast('Vote failed — please try again.', true);
    }
  } catch (err) {
    console.error('Vote error:', err);
    btn.disabled = false;
    btn.textContent = '▲ Vote';
    showToast('Network error — please try again.', true);
  }
}

// ── LOAD ──────────────────────────────────────────────────────────────────────
async function loadTopics() {
  try {
    renderTopics(await fetchTopics());
  } catch (err) {
    console.error('Load error:', err);
    document.getElementById('topics-tbody').innerHTML =
      '<tr class="state-row"><td colspan="5">Failed to load topics. Check the Apps Script URL in the page source.</td></tr>';
    document.getElementById('topic-count').textContent = '';
  }
}

// ── MODAL ─────────────────────────────────────────────────────────────────────
const overlay   = document.getElementById('modal-overlay');
const formError = document.getElementById('form-error');

function openModal()  { overlay.classList.add('open'); document.getElementById('field-name').focus(); }
function closeModal() {
  overlay.classList.remove('open');
  document.getElementById('add-topic-form').reset();
  formError.classList.remove('visible');
  const btn = document.getElementById('submit-btn');
  btn.disabled = false;
  btn.textContent = 'Add Topic';
}

document.getElementById('open-modal-btn').addEventListener('click', openModal);
document.getElementById('close-modal-btn').addEventListener('click', closeModal);
document.getElementById('cancel-btn').addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && overlay.classList.contains('open')) closeModal(); });

document.getElementById('add-topic-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  formError.classList.remove('visible');

  const name           = document.getElementById('field-name').value.trim();
  const topic          = document.getElementById('field-topic').value.trim();
  const seed_idea      = document.getElementById('field-seed').value.trim();
  const scheduled_date = document.getElementById('field-date').value;

  if (!name || !topic) {
    formError.textContent = 'Name and Topic are required.';
    formError.classList.add('visible');
    return;
  }

  const submitBtn = document.getElementById('submit-btn');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Adding…';

  try {
    await apiPost({ action: 'addTopic', name, topic, seed_idea, scheduled_date });
    await loadTopics();
    closeModal();
    showToast('Topic added!');
  } catch (err) {
    console.error('Add topic error:', err);
    formError.textContent = `Error: ${err.message}`;
    formError.classList.add('visible');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Add Topic';
  }
});

// ── TOAST ─────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, isError = false) {
  const toast = document.getElementById('toast');
  clearTimeout(toastTimer);
  toast.textContent = msg;
  toast.className = 'show' + (isError ? ' is-error' : '');
  toastTimer = setTimeout(() => { toast.className = ''; }, 3000);
}

// ── TABS ──────────────────────────────────────────────────────────────────────
let scheduleLoaded = false;

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.remove('active');
      t.setAttribute('aria-selected', 'false');
    });
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));

    tab.classList.add('active');
    tab.setAttribute('aria-selected', 'true');
    document.getElementById(tab.dataset.panel).classList.add('active');

    if (tab.dataset.panel === 'panel-schedule' && !scheduleLoaded) {
      loadSchedule();
    }
  });
});

// ── SCHEDULE: API ─────────────────────────────────────────────────────────────
async function fetchSchedule() {
  const res = await fetch(`${APPS_SCRIPT_URL}?action=getSchedule`);
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data.schedule;
}

// ── SCHEDULE: RENDER ──────────────────────────────────────────────────────────
function renderSchedule(list) {
  const tbody   = document.getElementById('schedule-tbody');
  const counter = document.getElementById('schedule-count');

  if (!list || list.length === 0) {
    tbody.innerHTML = '<tr class="state-row"><td colspan="4">No dates scheduled yet — add the first one!</td></tr>';
    counter.textContent = '0 dates';
    return;
  }

  counter.textContent = `${list.length} date${list.length === 1 ? '' : 's'}`;

  tbody.innerHTML = list.map(row => {
    const presenters = (row.presenters || []).map(n => renderChip(row.id, n)).join('')
      || '<span class="chip-empty">No presenters yet</span>';

    const hostHtml = row.host && row.host.trim()
      ? `<span class="host-name">${escHtml(row.host)}</span>
         <button class="link-btn" onclick="handleSetHost('${escHtml(row.id)}', this)">edit</button>`
      : `<span class="host-empty">No host</span>
         <button class="link-btn" onclick="handleSetHost('${escHtml(row.id)}', this)">set host</button>`;

    return `
      <tr>
        <td>${formatDate(row.date)}</td>
        <td class="host-cell" id="host-${row.id}">${hostHtml}</td>
        <td id="presenters-${row.id}">${presenters}</td>
        <td>
          <form class="inline-form" onsubmit="handleAddPresenter(event, '${escHtml(row.id)}')">
            <input type="text" placeholder="Your name" required />
            <button type="submit">Add me</button>
          </form>
        </td>
      </tr>`;
  }).join('');
}

// ── SCHEDULE: ACTIONS ─────────────────────────────────────────────────────────
function renderChip(scheduleId, name) {
  const sidAttr  = escHtml(scheduleId);
  const nameAttr = escHtml(name).replace(/'/g, '&#39;');
  return `<span class="chip">${escHtml(name)}<button type="button" class="chip-x" aria-label="Remove ${escHtml(name)}" onclick="handleRemovePresenter('${sidAttr}', '${nameAttr}', this)">&times;</button></span>`;
}

async function handleRemovePresenter(scheduleId, name, btn) {
  if (btn.disabled) return;
  if (!confirm(`Remove ${name} from this date?`)) return;

  btn.disabled = true;
  const chip = btn.closest('.chip');

  try {
    const result = await apiPost({ action: 'removePresenter', schedule_id: scheduleId, name });
    if (result.success) {
      const cell = chip.parentElement;
      chip.remove();
      if (!cell.querySelector('.chip')) {
        cell.innerHTML = '<span class="chip-empty">No presenters yet</span>';
      }
      showToast('Removed.');
    } else if (result.reason === 'not_found') {
      chip.remove();
      showToast('Already gone.', true);
    } else {
      btn.disabled = false;
      showToast('Could not remove — please try again.', true);
    }
  } catch (err) {
    console.error('Remove presenter error:', err);
    btn.disabled = false;
    showToast(`Error: ${err.message}`, true);
  }
}

async function handleAddPresenter(event, scheduleId) {
  event.preventDefault();
  const form  = event.target;
  const input = form.querySelector('input');
  const btn   = form.querySelector('button');
  const name  = input.value.trim();
  if (!name) return;

  btn.disabled = true;
  btn.textContent = '…';

  try {
    const result = await apiPost({ action: 'addPresenter', schedule_id: scheduleId, name });
    if (result.success) {
      const cell = document.getElementById(`presenters-${scheduleId}`);
      const empty = cell.querySelector('.chip-empty');
      if (empty) empty.remove();
      cell.insertAdjacentHTML('beforeend', renderChip(scheduleId, name));
      input.value = '';
      showToast('Signed up!');
    } else {
      showToast('Could not add — please try again.', true);
    }
  } catch (err) {
    console.error('Add presenter error:', err);
    showToast(`Error: ${err.message}`, true);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Add me';
  }
}

async function handleSetHost(scheduleId, linkEl) {
  const current = linkEl.parentElement.querySelector('.host-name');
  const existing = current ? current.textContent : '';
  const name = prompt('Host name (leave blank to clear):', existing);
  if (name === null) return;
  const trimmed = name.trim();

  try {
    const result = await apiPost({ action: 'setHost', schedule_id: scheduleId, host: trimmed });
    if (result.success) {
      const cell = document.getElementById(`host-${scheduleId}`);
      cell.innerHTML = trimmed
        ? `<span class="host-name">${escHtml(trimmed)}</span>
           <button class="link-btn" onclick="handleSetHost('${escHtml(scheduleId)}', this)">edit</button>`
        : `<span class="host-empty">No host</span>
           <button class="link-btn" onclick="handleSetHost('${escHtml(scheduleId)}', this)">set host</button>`;
      showToast(trimmed ? 'Host updated.' : 'Host cleared.');
    } else {
      showToast('Could not update host.', true);
    }
  } catch (err) {
    console.error('Set host error:', err);
    showToast(`Error: ${err.message}`, true);
  }
}

// ── SCHEDULE: LOAD ────────────────────────────────────────────────────────────
async function loadSchedule() {
  try {
    renderSchedule(await fetchSchedule());
    scheduleLoaded = true;
  } catch (err) {
    console.error('Schedule load error:', err);
    document.getElementById('schedule-tbody').innerHTML =
      '<tr class="state-row"><td colspan="4">Failed to load schedule. Check the Apps Script URL in the page source.</td></tr>';
    document.getElementById('schedule-count').textContent = '';
  }
}

// ── ADD-DATE MODAL ────────────────────────────────────────────────────────────
const dateOverlay   = document.getElementById('date-modal-overlay');
const dateFormError = document.getElementById('date-form-error');

function openDateModal()  { dateOverlay.classList.add('open'); document.getElementById('date-field-date').focus(); }
function closeDateModal() {
  dateOverlay.classList.remove('open');
  document.getElementById('add-date-form').reset();
  dateFormError.classList.remove('visible');
  const btn = document.getElementById('date-submit-btn');
  btn.disabled = false;
  btn.textContent = 'Add Date';
}

document.getElementById('open-date-modal-btn').addEventListener('click', openDateModal);
document.getElementById('close-date-modal-btn').addEventListener('click', closeDateModal);
document.getElementById('date-cancel-btn').addEventListener('click', closeDateModal);
dateOverlay.addEventListener('click', e => { if (e.target === dateOverlay) closeDateModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && dateOverlay.classList.contains('open')) closeDateModal(); });

document.getElementById('add-date-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  dateFormError.classList.remove('visible');

  const date = document.getElementById('date-field-date').value;
  const host = document.getElementById('date-field-host').value.trim();

  if (!date) {
    dateFormError.textContent = 'Date is required.';
    dateFormError.classList.add('visible');
    return;
  }

  const submitBtn = document.getElementById('date-submit-btn');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Adding…';

  try {
    const result = await apiPost({ action: 'addScheduleDate', date, host });
    if (result.success === false && result.reason === 'date_exists') {
      dateFormError.textContent = 'That date is already on the schedule.';
      dateFormError.classList.add('visible');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Add Date';
      return;
    }
    await loadSchedule();
    closeDateModal();
    showToast('Date added!');
  } catch (err) {
    console.error('Add date error:', err);
    dateFormError.textContent = `Error: ${err.message}`;
    dateFormError.classList.add('visible');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Add Date';
  }
});

loadTopics();
</script>
